name: Deploy to Cloudflare Pages

# main is public behind projects.cristian-nichifor.com/digital-romania-atlas/; dev is the
# protected preview behind projects-dev.cristian-nichifor.com, reached only through the
# CN Webify preview gate (ADR-022). The CN Webify token broker accepts this exact file on
# main and dev. The build sits under /digital-romania-atlas/ as on GitHub Pages, so the hub
# proxies the path 1:1. deploy.yml (GitHub Pages) stays until the hub switches upstreams.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the broker reads this job's GitHub OIDC token

concurrency:
  group: pages-cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PROJECT_NAME: digital-romania-atlas
  WRANGLER_VERSION: 4.149.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

      - name: Stage the GitHub Pages layout
        run: |
          set -euo pipefail
          mkdir -p "site/$PROJECT_NAME"
          cp -R dist/. "site/$PROJECT_NAME/"
          echo "/ /$PROJECT_NAME/ 302" > site/_redirects

      - name: Cloudflare token from the CN Webify broker
        run: |
          set -euo pipefail
          jwt=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://tokens.cnwebify.com" | jq -r .value)
          reply=$(curl -sf -X POST -H "Authorization: Bearer $jwt" https://tokens.cnwebify.com/token)
          token=$(jq -r .token <<<"$reply"); echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=5d5a0c8a05e5d8292065cd0c0cf60291" >> "$GITHUB_ENV"

      # Created once; Cloudflare may give the pages.dev name a random suffix.
      - name: Create the Pages project if missing
        run: |
          set -uo pipefail
          if ! out=$(npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PROJECT_NAME" \
            --production-branch main 2>&1); then
            grep -qi "already exists" <<<"$out" || { echo "$out"; exit 1; }
            echo "Pages project $PROJECT_NAME already exists."
          fi

      # functions/ (the preview gate check) is picked up from the repository root.
      - name: Deploy
        run: npx --yes "wrangler@$WRANGLER_VERSION" pages deploy site --project-name="$PROJECT_NAME" --branch="$GITHUB_REF_NAME"

      - name: Report the pages.dev host
        run: |
          set -euo pipefail
          subdomain=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            | jq -r .result.subdomain)
          echo "Pages project \`$PROJECT_NAME\` ($GITHUB_REF_NAME): https://$subdomain/$PROJECT_NAME/" >> "$GITHUB_STEP_SUMMARY"
