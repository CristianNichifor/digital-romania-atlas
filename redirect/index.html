<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S-a mutat — Digital Romania Atlas</title>
    <link
      rel="canonical"
      href="https://projects.cristian-nichifor.com/digital-romania-atlas/"
    />
    <meta name="robots" content="noindex" />
    <!--
      Served as both index.html and 404.html, so every old URL under
      /digital-romania-atlas/ lands here. The script keeps the rest of the path,
      the query and the hash, so a deep link still opens what it pointed at; the
      meta refresh is the no-JavaScript fallback and can only reach the base page.
    -->
    <script>
      (function () {
        var target =
          "https://projects.cristian-nichifor.com/digital-romania-atlas/";
        var rest = location.pathname.replace(
          /^\/digital-romania-atlas(\/|$)/i,
          ""
        );
        location.replace(
          target + rest.replace(/^\/+/, "") + location.search + location.hash
        );
      })();
    </script>
    <noscript>
      <meta
        http-equiv="refresh"
        content="0; url=https://projects.cristian-nichifor.com/digital-romania-atlas/"
      />
    </noscript>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0b0d10;
        color: #e8eaed;
        font:
          16px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      a {
        color: #7fb3ff;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f7f8fa;
          color: #14181d;
        }
        a {
          color: #1a5fd0;
        }
      }
      p {
        max-width: 32rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Atlasul s-a mutat</h1>
      <p>
        Digital Romania Atlas are o adresă nouă. Ar trebui să fii redirecționat
        imediat. / The atlas has moved; you should be redirected right away.
      </p>
      <p>
        <a href="https://projects.cristian-nichifor.com/digital-romania-atlas/"
          >projects.cristian-nichifor.com/digital-romania-atlas/</a
        >
      </p>
    </main>
  </body>
</html>
